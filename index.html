<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle - BOUGH</title>
    <style>
        :root {
            --color-correct: #6aaa64;
            --color-present: #c9b458;
            --color-absent: #787c7e;
            --color-tile-border: #d3d6da;
            --color-tile-text: #000000;
            --color-key-bg: #d3d6da;
            --color-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 10px 0;
            box-sizing: border-box;
        }

        header {
            border-bottom: 1px solid var(--color-tile-border);
            width: 100%;
            text-align: center;
            padding-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
        }

        .tile {
            width: 52px;
            height: 52px;
            border: 2px solid var(--color-tile-border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.15s ease, background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }

        .tile[data-state="pop"] {
            animation: pop 0.1s ease-in-out;
            border-color: #878a8c;
        }

        .tile[data-state="correct"] {
            background-color: var(--color-correct);
            border-color: var(--color-correct);
            color: white;
        }

        .tile[data-state="present"] {
            background-color: var(--color-present);
            border-color: var(--color-present);
            color: white;
        }

        .tile[data-state="absent"] {
            background-color: var(--color-absent);
            border-color: var(--color-absent);
            color: white;
        }

        #keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 500px;
            padding: 0 8px;
            box-sizing: border-box;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .key {
            font-family: inherit;
            font-weight: bold;
            border: 0;
            padding: 0;
            margin: 0;
            height: 58px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            background-color: var(--color-key-bg);
            color: black;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        .key.wide {
            flex: 1.5;
            font-size: 0.8rem;
        }

        .key[data-state="correct"] {
            background-color: var(--color-correct);
            color: white;
        }

        .key[data-state="present"] {
            background-color: var(--color-present);
            color: white;
        }

        .key[data-state="absent"] {
            background-color: var(--color-absent);
            color: white;
        }

        #message {
            min-height: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }

        .shake {
            animation: shake 0.5s;
        }
    </style>
</head>
<body>

    <header>
        <h1>WORDLE</h1>
    </header>

    <div id="game-container">
        <div id="message"></div>
        <div id="grid"></div>
    </div>

    <div id="keyboard"></div>

    <script>
        const TARGET_WORD = "BOUGH";
        const WORD_LENGTH = 5;
        const MAX_ATTEMPTS = 6;

        let currentAttempt = 0;
        let currentGuess = "";
        let gameOver = false;

        const grid = document.getElementById("grid");
        const keyboard = document.getElementById("keyboard");
        const message = document.getElementById("message");

        // Build 6x5 Grid
        for (let i = 0; i < MAX_ATTEMPTS; i++) {
            const row = document.createElement("div");
            row.className = "row";
            row.dataset.row = i;
            for (let j = 0; j < WORD_LENGTH; j++) {
                const tile = document.createElement("div");
                tile.className = "tile";
                tile.dataset.col = j;
                row.appendChild(tile);
            }
            grid.appendChild(row);
        }

        // Build Virtual Keyboard
        const keyboardLayout = [
            ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
            ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
            ["ENTER", "Z", "X", "C", "V", "B", "N", "M", "DELETE"]
        ];

        keyboardLayout.forEach(rowKeys => {
            const row = document.createElement("div");
            row.className = "keyboard-row";
            rowKeys.forEach(key => {
                const btn = document.createElement("button");
                btn.className = "key";
                btn.innerText = key === "DELETE" ? "⌫" : key;
                btn.dataset.key = key;
                if (key === "ENTER" || key === "DELETE") btn.classList.add("wide");
                btn.addEventListener("click", () => handleInput(key));
                row.appendChild(btn);
            });
            keyboard.appendChild(row);
        });

        // Listen for Physical Keyboard Input
        document.addEventListener("keydown", (e) => {
            if (gameOver) return;
            let key = e.key.toUpperCase();
            if (key === "ENTER") handleInput("ENTER");
            else if (key === "BACKSPACE") handleInput("DELETE");
            else if (/^[A-Z]$/.test(key)) handleInput(key);
        });

        function handleInput(key) {
            if (gameOver) return;

            if (key === "DELETE") {
                if (currentGuess.length > 0) {
                    currentGuess = currentGuess.slice(0, -1);
                    updateTileText();
                }
            } else if (key === "ENTER") {
                if (currentGuess.length === WORD_LENGTH) {
                    submitGuess();
                } else {
                    showMessage("Not enough letters");
                    shakeRow();
                }
            } else if (currentGuess.length < WORD_LENGTH) {
                currentGuess += key;
                updateTileText();
            }
        }

        function updateTileText() {
            const currentRow = grid.children[currentAttempt];
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = currentRow.children[i];
                if (i < currentGuess.length) {
                    if (tile.innerText !== currentGuess[i]) {
                        tile.innerText = currentGuess[i];
                        tile.dataset.state = "pop";
                    }
                } else {
                    tile.innerText = "";
                    delete tile.dataset.state;
                }
            }
        }

        function submitGuess() {
            const currentRow = grid.children[currentAttempt];
            const letterCounts = {};

            // Count occurrences in target word
            for (let char of TARGET_WORD) {
                letterCounts[char] = (letterCounts[char] || 0) + 1;
            }

            const rowState = Array(WORD_LENGTH).fill("absent");

            // First pass: find exact matches (green)
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (currentGuess[i] === TARGET_WORD[i]) {
                    rowState[i] = "correct";
                    letterCounts[currentGuess[i]]--;
                }
            }

            // Second pass: find partial matches (yellow)
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (rowState[i] !== "correct") {
                    if (letterCounts[currentGuess[i]] > 0) {
                        rowState[i] = "present";
                        letterCounts[currentGuess[i]]--;
                    }
                }
            }

            // Apply tiles state and keyboard state
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = currentRow.children[i];
                const letter = currentGuess[i];
                const state = rowState[i];

                tile.dataset.state = state;
                updateKeyboardState(letter, state);
            }

            // Game End Conditions
            if (currentGuess === TARGET_WORD) {
                showMessage("Splendid! 🎉");
                gameOver = true;
            } else if (currentAttempt === MAX_ATTEMPTS - 1) {
                showMessage(`Game Over! Word was: ${TARGET_WORD}`);
                gameOver = true;
            } else {
                currentAttempt++;
                currentGuess = "";
            }
        }

        function updateKeyboardState(letter, state) {
            const keyBtn = keyboard.querySelector(`[data-key="${letter}"]`);
            if (!keyBtn) return;

            const currentState = keyBtn.dataset.state;
            if (currentState === "correct") return; // Keep highest priority
            if (currentState === "present" && state === "absent") return;

            keyBtn.dataset.state = state;
        }

        function showMessage(msg) {
            message.innerText = msg;
        }

        function shakeRow() {
            const currentRow = grid.children[currentAttempt];
            currentRow.classList.add("shake");
            setTimeout(() => currentRow.classList.remove("shake"), 500);
        }
    </script>
</body>
</html>
